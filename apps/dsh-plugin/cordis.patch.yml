- insert:
    - id: bybit-quant
      name: '@bybit-quant/dsh-plugin'
      config:
        # 'demo' uses Bybit demo-trading funds, 'testnet' the testnet, 'live' real money.
        env: testnet
        # Independently operated read-only public linear Testnet engine.
        engineBaseUrl: http://127.0.0.1:8765
        # Optional independent native synthetic paper service; see the paper runbook.
        # All settings below are nonsecret. Configure through supported DSH controls.
        # paperBaseUrl: http://127.0.0.1:8766
        # paperSessionId: native-paper-demo
        # paperCapabilitySocket: /private/tmp/bqp-UID/session.sock
        # paperControlEnabled: false
        # Preview validation ceiling only; exchange writes are unavailable until
        # the engine-owned native execution authority is connected.
        maxOrderNotionalUsd: 24
        # Credential variable names are environment-scoped by host-config:
        # Testnet uses BYBIT_API_KEY/BYBIT_API_SECRET; Mainnet uses
        # BYBIT_MAINNET_API_KEY/BYBIT_MAINNET_API_SECRET. Values never belong here.
        # Starting cash of the simulated (paper) book.
        paperBalanceUsd: 10000
        defaultSymbol: BTCUSDT
        defaultCategory: linear
        # AI decision track: the model proposes, these limits decide what is allowed.
        aiEnabled: true
        aiRiskPerTradePct: 1
        aiMaxOpenPositions: 2
        aiMaxDailyLossPct: 3
        aiMaxDrawdownPct: 20
        # Starting default only: quant_watchlist owns the list afterwards.
        aiSymbols: []
        # Background AI wake-ups are opt-in and record simulated decisions only.
        # Dashboard chart filters never change the AI candidate universe.
        aiBackgroundLoopEnabled: false
        aiBackgroundLoopIntervalMs: 900000
        aiBackgroundEnvironment: testnet
