[project]
name = "bybit-quant-execution"
version = "0.1.0"
description = "Offline native Nautilus execution foundation; no exchange connectivity"
requires-python = ">=3.12,<3.15"
dependencies = ["nautilus-trader==1.231.0", "fsspec==2026.6.0"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_execution"]
