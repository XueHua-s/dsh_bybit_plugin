description = "Independent pure deterministic risk veto; no execution or exchange access"
requires-python = ">=3.12,<3.15"
dependencies = []

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_risk"]
