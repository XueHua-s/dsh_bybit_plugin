[project]
name = "bybit-quant-workspace"
version = "0.1.0"
description = "uv workspace for the Bybit AI Quant data plane"
requires-python = ">=3.12,<3.15"
dependencies = ["bybit-quant-data", "bybit-quant-engine", "bybit-quant-execution", "bybit-quant-portfolio", "bybit-quant-risk", "bybit-quant-strategies"]

[tool.uv]
package = false
# Security override: PYSEC-2026-4217; upstream Nautilus 1.231.0 pins vulnerable 2026.2.0.
# See DESIGN_NAUTILUS_EXECUTION.md for tested scope and metadata incompatibility.
override-dependencies = ["fsspec==2026.6.0"]

[tool.uv.sources]
bybit-quant-data = { workspace = true }
bybit-quant-engine = { workspace = true }
bybit-quant-execution = { workspace = true }
bybit-quant-portfolio = { workspace = true }
bybit-quant-risk = { workspace = true }
bybit-quant-strategies = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6,<7",
  "cyclonedx-bom>=8.0.1",
  "pip-audit>=2.10.1",
  "pyright>=1.1.414",
  "pytest>=9.0.3,<10",
  "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pyright]
include = ["packages", "apps"]
pythonVersion = "3.12"
