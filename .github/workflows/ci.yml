name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Nx, TypeScript, Python, Bundle, and security checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned gitleaks with verified SHA256
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan committed history for secrets
        run: gitleaks git --redact --no-banner --ignore-gitleaks-allow
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project python --locked --all-groups
      - run: pnpm run verify
      - run: pnpm run typecheck:tests
      - run: pnpm exec nx run-many -p quant-data quant-engine quant-execution quant-risk -t lint typecheck test --parallel=1
      - run: pnpm exec nx run quant-risk:build
      - run: pnpm exec nx run quant-engine:openapi-check
      - run: uv run --project python --locked ruff format --check python/packages python/apps
      - run: pnpm run security:deps
      - run: pnpm run sbom
      - run: pnpm exec nx run quant-data:sbom

  network:
    # Read-only public Testnet smoke; allowed to fail without blocking a merge.
    name: Bybit Testnet smoke (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run @bybit-quant/dsh-plugin:build
      - run: pnpm exec nx run @bybit-quant/dsh-plugin:test:network
